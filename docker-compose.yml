services:
  postgres:
    image: postgres:16
    container_name: badminton-roster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: badminton_roster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badminton_roster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
